name: Build Unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26 toolchain
        run: |
          chosen=""
          for app in $(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -Vr); do
            if [ -d "$app/Contents/Developer" ]; then
              chosen="$app"
              break
            fi
          done
          if [ -z "$chosen" ]; then
            for app in $(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -Vr); do
              if [ -d "$app/Contents/Developer" ]; then
                chosen="$app"
                break
              fi
            done
          fi
          echo "Using $chosen"
          sudo xcode-select -s "$chosen"
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build unsigned iPhone app
        working-directory: NeteaseMusic
        run: |
          xcodebuild \
            -project NeteaseMusic.xcodeproj \
            -scheme NeteaseMusic \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        working-directory: NeteaseMusic
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NeteaseMusic.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload Youmi-Music-unsigned-1.2.ipa
          ls -lh Youmi-Music-unsigned-1.2.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Youmi-Music-unsigned-1.2-ipa
          path: NeteaseMusic/Youmi-Music-unsigned-1.2.ipa
